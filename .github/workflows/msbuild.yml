name: MSBuild
on:
  push:
  pull_request:
env:
  SOLUTION_FILE_PATH: Juiced Patch.sln
  BUILD_CONFIGURATION: Release
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2
    - name: Restore NuGet packages
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: nuget restore "${{ env.SOLUTION_FILE_PATH }}"
    - name: Build standalone FXO compiler
      run: msbuild tools/FXOCompiler/FXOCompiler.vcxproj /m /p:Configuration=Release /p:Platform=x64
    - name: Validate standalone FXO compiler
      shell: pwsh
      run: tools/FXOCompiler/Validate.ps1 -Compiler tools/FXOCompiler/.out/FXOCompiler.exe -Manifest shaders/colour/build.ini
    - name: Compile HLSL shaders into matching FXO files and headers
      shell: pwsh
      run: |
        & tools/FXOCompiler/.out/FXOCompiler.exe build shaders/colour/build.ini
        if ($LASTEXITCODE -ne 0) { throw "FXO shader compilation failed." }
    - name: Build solution
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=Win32 "${{ env.SOLUTION_FILE_PATH }}"
    - name: Prepare output folder
      run: |
        mkdir upload
        copy "Release\DFEngine.dll" upload\
        copy "Release\DFEngine.pdb" upload\
        copy "Discord\discord_game_sdk.dll" upload\
        copy "Juiced Patch\Ext\lib\x86\SDL3.dll" upload\
        copy "external\SDL_GameControllerDB\gamecontrollerdb.txt" upload\
        copy "juiced.ini" upload\
        copy "loose.txt" upload\
        copy "license.txt" upload\
        copy "ship\readme.txt" upload\
        xcopy "ship" "upload" /E /I /Y
        xcopy Mods upload\Mods /E /I /Y
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: SR2_JUICED
        path: upload
    - name: Upload standalone FXO compiler
      uses: actions/upload-artifact@v4
      with:
        name: SR2_FXOCompiler
        path: tools/FXOCompiler/.out/FXOCompiler.exe
        if-no-files-found: error
